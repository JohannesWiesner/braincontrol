<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title description">
  <title id="title">braincontrol</title>
  <desc id="description">Two interconnected brain networks joined by a curved trajectory from an initial state to a target state.</desc>

  <defs>
    <linearGradient id="source-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="target-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="trajectory" x1="352" y1="255" x2="760" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".48" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <g id="brain-outline">
      <path d="M 51 150 C 24 146 14 118 28 96 C 14 77 23 52 47 43 C 47 19 69 7 90 13 C 103 -4 131 -5 147 10 C 168 -3 198 6 207 27 C 236 26 252 46 250 67 C 273 77 277 104 260 121 C 269 144 254 166 230 170 C 218 190 193 192 178 181 C 160 193 142 187 132 174 C 112 185 93 179 83 164 C 70 168 58 161 51 150 Z"/>
      <path d="M 90 13 C 80 29 86 43 102 49 M 147 10 C 142 28 148 39 166 47 M 207 27 C 193 42 195 56 211 67 M 47 43 C 61 53 65 67 58 79 M 28 96 C 46 98 54 107 54 124 M 260 121 C 245 124 236 134 235 148 M 83 164 C 90 147 104 140 119 144 M 178 181 C 184 164 194 154 211 153"/>
      <path d="M 119 174 C 122 156 138 150 153 157 C 166 141 176 124 172 105 C 171 85 178 71 195 66 M 67 106 C 81 89 99 89 114 102 C 127 87 145 88 157 98 M 90 64 C 110 58 122 65 128 80 M 180 111 C 201 99 220 101 234 113"/>
    </g>

    <g id="network-links" fill="none" stroke-width="2" stroke-linecap="round" opacity=".58">
      <path d="M 66 112 L 97 70 L 137 88 L 174 60 L 213 84"/>
      <path d="M 66 112 L 109 128 L 137 88 L 162 130 L 213 84"/>
      <path d="M 109 128 L 137 150 L 162 130 L 205 144 L 225 113"/>
      <path d="M 97 70 L 109 128 M 174 60 L 162 130 M 213 84 L 225 113"/>
    </g>

    <g id="network-nodes">
      <circle cx="66" cy="112" r="5"/>
      <circle cx="97" cy="70" r="5"/>
      <circle cx="137" cy="88" r="6"/>
      <circle cx="174" cy="60" r="5"/>
      <circle cx="213" cy="84" r="5"/>
      <circle cx="109" cy="128" r="5"/>
      <circle cx="162" cy="130" r="6"/>
      <circle cx="137" cy="150" r="4"/>
      <circle cx="205" cy="144" r="5"/>
      <circle cx="225" cy="113" r="4"/>
    </g>
  </defs>

  <!-- Initial brain state -->
  <g transform="translate(100 84)">
    <use href="#brain-outline" fill="url(#source-fill)" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#network-links" stroke="#0891b2"/>
    <use href="#network-nodes" fill="#06b6d4"/>
  </g>

  <!-- Target brain state -->
  <g transform="translate(730 84)">
    <use href="#brain-outline" fill="url(#target-fill)" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#network-links" stroke="#7c3aed"/>
    <use href="#network-nodes" fill="#8b5cf6"/>
  </g>

  <!-- Optimal control trajectory and its sampled states -->
  <path d="M 326 196 C 414 280 472 110 560 155 S 676 253 788 167" fill="none" stroke="url(#trajectory)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 764 164 L 789 166 L 781 188" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#fff" stroke-width="3">
    <circle cx="376" cy="211" r="5" stroke="#0ea5e9"/>
    <circle cx="465" cy="167" r="5" stroke="#2563eb"/>
    <circle cx="560" cy="155" r="6" stroke="#4f46e5"/>
    <circle cx="646" cy="195" r="5" stroke="#6366f1"/>
    <circle cx="732" cy="194" r="5" stroke="#7c3aed"/>
  </g>

  <!-- Source and target annotations -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="600">
    <text x="214" y="311" fill="#0891b2">x₀</text>
    <text x="844" y="311" fill="#7c3aed">x<tspan baseline-shift="sub" font-size="15">f</tspan></text>
  </g>

  <!-- Project wordmark -->
  <text x="550" y="375" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">
    <tspan fill="#0891b2">brain</tspan><tspan fill="#6d28d9">control</tspan>
  </text>
  <text x="550" y="415" text-anchor="middle" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" letter-spacing="3.2">NETWORK CONTROL THEORY FOR NEUROIMAGING</text>
</svg>
